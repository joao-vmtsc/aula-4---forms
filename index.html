<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post">
      <fieldset>
        <legend>Informações Pessoais</legend>

        <label for="nome">Nome Completo:</label>
        <input type="text" id="none" name="nome" placeholder="Digite seu nome completo" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

        <label for="senha">Crie uma senha:</label>
        <input type="password" id="senha" name="senha" minlength="6" maxlength="12" required>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <h2>Contato e localização</h2>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="cidade">Cidade:</label>
        <input type="cidade" id="cidade" name="cidade" required>

        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required>
            <option value="">Selecione...</option>
            <option value="SC">Santa Catarina</option>
            <option value="PE">Pernambuco</option>
            <option value="SP">São Paulo</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="MG">Minas Gerais</option>
        </select>      

        <h2>Preferências de serviço</h2>

        <p>Deseja receber novidades por e-mail?</p>
        <input type="radio" id="sim" name="novidades" value="sim" required>
        <label for="sim">Sim</label>

        <input type="radio" id="nao" name="novidades" value="nao" required>
        <label for="nao">Não</label>

        <p>Selecione os serviços de interesse:</p>
        <input type="checkbox" id="web" name="servicos" value="web">
        <label for="web">Desenvolvimento Web</label>

        <input type="checkbox" id="design" name="servicos" value="design">
        <label for="design">Design Digital</label>

        <input type="checkbox" id="redes" name="servicos" value="redes">
        <label for="redes">Redes de Computadores</label>
    </fieldset>
<br>
        <legend>Comentários  </legend>
        <label for="mensagem">Deixe uma mensagem (opcional):</label>
        <br>
        <textarea id="mensagem" name="mensagem" rows="14" cols="50" placeholder="Digite suas observações..."></textarea>
        <br>

    <button type="submit">Enviar Cadastro</button>
    <button type="reset">Limpar</button>
    </form>
</body>
</html>
